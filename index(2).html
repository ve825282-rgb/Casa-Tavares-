<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b10">
<title>Casa Tavares · Acesso privado</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');
:root{color-scheme:dark;--bg:#090b10;--panel:#141922;--line:#303847;--gold:#c9aa70;--text:#f4f1e9;--muted:#9ba5b4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#1b2029 0%,#0d1017 42%,#07090d 100%);font-family:'DM Sans',sans-serif;color:var(--text)}
.wrap{width:min(100%,430px);text-align:center}
.mark{width:64px;height:64px;margin:0 auto 20px;border:1px solid #8f754b;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,#242a34,#11151c);box-shadow:0 12px 36px #0008;color:var(--gold);font-size:27px}
h1{font:700 clamp(32px,8vw,42px)/1.1 'Playfair Display',Georgia,serif;letter-spacing:.2px;margin:0}
.kicker{margin:12px 0 30px;color:var(--gold);font-size:10px;letter-spacing:3.2px;font-weight:700}
.card{padding:30px 26px 24px;background:linear-gradient(160deg,#191f2a,#11151d);border:1px solid var(--line);border-radius:22px;text-align:left;box-shadow:0 24px 70px #0008}
.card h2{font-size:21px;margin:0 0 8px;font-weight:600}
.desc{font-size:14px;color:var(--muted);line-height:1.6;margin:0 0 24px}
label{display:block;font-size:11px;color:#c5cbd4;letter-spacing:1.3px;text-transform:uppercase;margin:0 0 9px}
input{width:100%;height:52px;border:1px solid #3a4555;border-radius:12px;background:#0b0f16;color:var(--text);padding:0 15px;font:500 16px 'DM Sans',sans-serif;outline:none;transition:.2s}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #c9aa7020}
button{width:100%;height:52px;margin-top:16px;border:0;border-radius:12px;background:linear-gradient(110deg,#d6bd8d,#b89155);color:#17130d;font:700 14px 'DM Sans',sans-serif;letter-spacing:.3px;cursor:pointer;transition:transform .15s,filter .15s}
button:hover{filter:brightness(1.07);transform:translateY(-1px)}
button:disabled{opacity:.65;cursor:wait;transform:none}
.msg{display:none;margin:14px 0 0;padding:11px 12px;border-radius:10px;font-size:13px;line-height:1.5}
.msg.error{display:block;background:#3a1d24;color:#ffc4ca;border:1px solid #71333d}
.msg.info{display:block;background:#252719;color:#e7d9a9;border:1px solid #5e5633}
.hint{margin-top:14px;color:#b4a47f;font-size:12px;line-height:1.5}
.foot{margin-top:22px;color:#697382;font-size:10px;letter-spacing:2px}
.secure{display:flex;justify-content:center;align-items:center;gap:7px;color:#8792a1;font-size:11px;margin-top:19px}
.secure svg{width:14px;height:14px;stroke:var(--gold)}
@media(max-width:420px){.card{padding:26px 21px}.kicker{margin-bottom:24px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="mark" aria-hidden="true">⌂</div>
  <h1>Casa Tavares</h1>
  <div class="kicker">ACESSO PRIVADO</div>
  <section class="card">
    <h2>Bem-vindo</h2>
    <p class="desc">Este conteúdo é reservado. Insira sua senha para continuar.</p>
    <form id="unlockForm">
      <label for="password">Sua senha</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required autofocus>
      <button id="unlock" type="submit">Desbloquear acesso&nbsp; →</button>
      <div id="message" class="msg" role="status" aria-live="polite"></div>
      <div id="hint" class="hint"></div>
    </form>
  </section>
  <div class="secure">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    Proteção criptográfica · A senha é processada neste dispositivo
  </div>
  <div class="foot">CASA TAVARES&nbsp; · &nbsp;ACESSO RESTRITO</div>
</main>
<script>
/* Compatibilidade com o formato Link Lock v0.0.1:
   AES-GCM 256 bits + PBKDF2/SHA-256, 100.000 iterações. */
const DEFAULT_PAYLOAD = "eyJ2IjoiMC4wLjEiLCJlIjoiMVA5NFdPQ2tzam13Vmc5Ykx0WG5wcHBUaXNCOXJJRDhYY0ZOazB0M2hZVTltazdjNUtvTHQ0SzVQWkRqMjl0WW5tbTQrLzZEUnZBUXhhZE5WUVVxdmxMbDRvb1FQSDhvdWkxckRYSVpTYnFxV1lQUUVWYmxDanRzSVNFPSIsInMiOiJIa2QxT2F3eWtOSnhPM1hWdm9uWDFBPT0iLCJpIjoiWmRkWkVQc20vVUxkMkdyTSJ9";
function b64ToBytes(s){
  const bin=atob(s); const out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
function decodeBase64UrlPayload(s){
  return new TextDecoder().decode(b64ToBytes(s.replace(/-/g,'+').replace(/_/g,'/')));
}
function asciiBytes(s){
  const out=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);if(c>255)throw Error("Senha inválida.");out[i]=c;}
  return out;
}
const STATIC_SALT=Uint8Array.from([236,231,167,249,207,95,201,235,164,98,246,26,176,174,72,249]);
const STATIC_IV=Uint8Array.from([255,237,148,105,6,255,123,202,115,130,16,116]);
async function decryptLink(params,password){
  if(params.v!=="0.0.1"||!params.e) throw Error("Formato do link não reconhecido.");
  const salt=params.s?b64ToBytes(params.s):STATIC_SALT;
  const iv=params.i?b64ToBytes(params.i):STATIC_IV;
  const material=await crypto.subtle.importKey("raw",asciiBytes(password),{name:"PBKDF2"},false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:100000,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,b64ToBytes(params.e));
  return new TextDecoder("utf-8").decode(plain);
}
function showMessage(text,type){
  const el=document.getElementById("message");el.textContent=text;el.className="msg "+type;
}
function getPayload(){
  const fragment=location.hash.slice(1);
  return fragment||DEFAULT_PAYLOAD;
}
async function start(){
  const raw=getPayload();
  if(!raw){showMessage("Link protegido não encontrado. Confira o endereço recebido.","error");return;}
  let params;
  try{params=JSON.parse(decodeBase64UrlPayload(raw));}
  catch(e){showMessage("Não foi possível ler os dados deste link.","error");return;}
  if(params.h)document.getElementById("hint").textContent="Dica: "+params.h;
  document.getElementById("unlockForm").addEventListener("submit",async e=>{
    e.preventDefault();
    const button=document.getElementById("unlock");
    const password=document.getElementById("password").value;
    button.disabled=true;button.textContent="Verificando…";
    try{
      const url=await decryptLink(params,password);
      const parsed=new URL(url);
      if(!["http:","https:","magnet:"].includes(parsed.protocol)) throw Error("Destino não permitido.");
      showMessage("Senha correta. Abrindo conteúdo…","info");
      // A tela de acesso é substituída pelo destino no mesmo separador.
      window.location.href=url;
    }catch(err){
      showMessage("Senha incorreta ou link inválido. Confira e tente novamente.","error");
      button.disabled=false;button.textContent="Desbloquear acesso  →";
      document.getElementById("password").select();
    }
  });
}
start();
</script>
</body>
</html>
